<!doctype html>
<!--
  Maeve's Purrfect Beach Day, a little game for Anna
  Single file, no libraries. Upload it to a GitHub repo as index.html, switch on GitHub Pages
  and open  https://<username>.github.io/<repo>/  in Safari.
  Edit the words (title, proposal message, names) in the CONFIG block in the script.
  Testing shortcuts (add to the end of the link): ?level=5 jumps to level 5, ?unlock opens every level,
  ?finale goes straight to the proposal scene.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffb3d1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maeve">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<title>Maeve's Purrfect Beach Day</title>
<style>
  :root { --script:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive; --ui:"Avenir Next Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#ffc9e1; font-family:var(--ui); }
  body { position:fixed; inset:0; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #overlay { position:fixed; inset:0; z-index:5; display:none; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);
    background:rgba(90,20,70,.34); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  #overlay.show { display:flex; }
  #overlay.light { background:rgba(90,20,70,.12); -webkit-backdrop-filter:none; backdrop-filter:none; align-items:flex-end; }
  .card { width:100%; max-width:410px; max-height:100%; overflow:auto; text-align:center; color:#7a2250;
    background:linear-gradient(180deg,#fff9fc,#ffe8f2); border:3px solid #ff9cc7; border-radius:28px; padding:0 22px 20px;
    box-shadow:0 20px 50px rgba(120,20,80,.35); animation:pop .55s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes pop { from { opacity:0; transform:scale(.85) translateY(20px); } to { opacity:1; transform:none; } }
  .leo { height:22px; margin:0 -22px 14px; background-color:#eaa650;
    background-image:radial-gradient(circle at 8px 7px,#d37a26 0 2px,#5a2d14 2.5px 4px,transparent 4.6px),radial-gradient(circle at 26px 16px,#d37a26 0 2px,#5a2d14 2.5px 4px,transparent 4.6px);
    background-size:36px 22px; }
  .emo { font-size:26px; letter-spacing:6px; animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-5px); } }
  .big { font-size:54px; line-height:1.1; animation:bob 2s ease-in-out infinite; }
  .card h1 { margin:6px 0 2px; font:normal clamp(34px,10vw,46px)/1.05 var(--script); color:#d81b6a; text-shadow:0 2px 0 #fff; }
  .card h2 { margin:8px 0; font:normal clamp(25px,7vw,32px)/1.15 var(--script); color:#d81b6a; }
  .card h2.q { font-size:clamp(30px,8.5vw,40px); }
  .card p { margin:6px 0; font-size:15px; line-height:1.4; }
  .card .sub { font-style:italic; color:#b0457f; }
  .card .tiny { font-size:12px; color:#b0457f; opacity:.85; }
  .btns { margin-top:12px; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .btns button { font:700 17px var(--ui); padding:13px 26px; border:0; border-radius:999px; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#ff8fbe,#e0488a); box-shadow:0 8px 18px rgba(200,40,110,.35); }
  .btns button.alt { background:#fff; color:#d81b6a; border:2px solid #ff9cc7; box-shadow:none; }
  .btns button:active { transform:scale(.97); }
  #mute { position:fixed; z-index:6; right:calc(env(safe-area-inset-right,0px) + 10px); bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    width:42px; height:42px; border-radius:50%; border:0; font-size:19px; background:rgba(255,255,255,.75); box-shadow:0 3px 10px rgba(120,20,80,.25); }
  .card { touch-action:pan-y; }
  .card.wide { max-width:540px; }
  .card.gold { border-color:#ffc83d; box-shadow:0 0 0 4px rgba(255,214,90,.45),0 20px 50px rgba(120,20,80,.35); }
  .chip { display:inline-block; margin:6px 0; padding:5px 14px; border-radius:999px; background:#fff; border:2px solid #ffc2da; font-weight:800; color:#c2185b; font-size:15px; }
  .homerow, .shoprow { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  canvas.pv { position:static; inset:auto; width:116px; height:116px; flex:none; touch-action:auto; }
  .homecol { flex:1 1 0; min-width:0; }
  .homecol h1 { font-size:clamp(25px,6vw,34px); overflow-wrap:anywhere; }
  @media (max-width:480px) { .homerow { flex-direction:column; } .homecol { flex:none; width:100%; } }
  .worlds { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; margin:6px 0; }
  .world { background:rgba(255,255,255,.7); border:2px solid #ffc2da; border-radius:16px; padding:6px 8px 8px; }
  .wn { font:800 12px var(--ui); color:#b0457f; margin-bottom:5px; }
  .lv3 { display:flex; gap:6px; justify-content:center; }
  .lvb { flex:1; min-width:0; padding:6px 2px; border:0; border-radius:12px; background:linear-gradient(135deg,#ffa6c9,#e65a95); color:#fff; font-family:var(--ui); cursor:pointer; box-shadow:0 3px 8px rgba(200,40,110,.3); }
  .lvb b { display:block; font-size:20px; line-height:1.15; }
  .lvb span { display:block; font-size:13px; letter-spacing:1px; color:#ffe27a; min-height:16px; }
  .lvb span i { font-style:normal; color:rgba(255,255,255,.45); }
  .lvb.lock { background:#e9dce3; color:#a58b9a; box-shadow:none; }
  .lvb.nope { animation:nope .4s; }
  @keyframes nope { 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
  .head { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
  .head h2, .head .chip { margin:2px 0; }
  .shoprow canvas.pv { width:128px; height:128px; }
  .items { flex:1 1 220px; max-height:190px; overflow-y:auto; touch-action:pan-y; text-align:left; }
  .item { display:flex; align-items:center; gap:8px; padding:3px 6px; border-bottom:1px dashed #ffc2da; }
  .item .ic { font-size:22px; width:28px; text-align:center; }
  .item .nm { flex:1; font-weight:700; font-size:14px; }
  .item button { font:800 13px var(--ui); border:0; border-radius:999px; padding:7px 12px; min-width:96px; cursor:pointer; }
  .item button.buy { background:linear-gradient(135deg,#ff8fbe,#e0488a); color:#fff; }
  .item button.cant { background:#eadbe3; color:#a58b9a; }
  .item button.own { background:#fff; color:#d81b6a; border:2px solid #ff9cc7; }
  .item button.on { background:#ffe27a; color:#8a5a00; }
  .stars3 { display:flex; justify-content:center; gap:6px; margin:4px 0 0; }
  .st { font-size:52px; line-height:1; }
  .st.off { color:#ead8e1; }
  .st.on { color:#ffb62e; text-shadow:0 3px 0 #e08a00,0 0 18px rgba(255,200,60,.6); transform:scale(0); animation:starpop .6s cubic-bezier(.2,1.7,.4,1) forwards; animation-delay:var(--d); }
  @keyframes starpop { from { transform:scale(0) rotate(-40deg); } to { transform:scale(1) rotate(0); } }
  .card p.praise { font:normal clamp(24px,6.5vw,30px) var(--script); color:#d81b6a; margin:2px 0 6px; }
  #homeBtn { display:none; position:fixed; z-index:6; left:calc(env(safe-area-inset-left,0px) + 10px); bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    width:42px; height:42px; border-radius:50%; border:0; font-size:19px; background:rgba(255,255,255,.75); box-shadow:0 3px 10px rgba(120,20,80,.25); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"></div>
<button id="mute" type="button" aria-label="Sound on or off">🔊</button>
<button id="homeBtn" type="button" aria-label="Back to menu">🏠</button>
<script>
(() => {
'use strict';

/* ============ 1 · EDIT YOUR WORDS HERE ============ */
const CONFIG = {
  title: "Maeve's Purrfect Beach Day",
  subtitle: 'a little adventure for Anna',
  from: 'Alasdair',
  found: 'Maeve found something very, very special at the end of the pier…',
  question: 'Anna Poole, will you marry me?',
  yes1: 'Yes ♥',
  yes2: 'Yes, obviously ♥♥',
  after: 'You said yes!',
  afterSub: 'Take a screenshot and send it to me. I love you, Anna ♥',
  /* Optional: your own cat artwork (transparent PNGs, cat facing right, saved next to this file).
     Example: catSprites: { run: ['cat-run1.png','cat-run2.png'], jump: 'cat-jump.png', height: 52 } */
  catSprites: { run: [], jump: '', height: 52 }
};

/* ============ 2 · HELPERS, GAME STATE AND SOUND ============ */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hsh = k => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const cv = $('game'); let g = cv.getContext('2d');
const VH = 300, GROUND = 232, FLOOR = 250, GRAV = 1500, JV = -520;
let W = 0, H = 0, DPR = 1, VW = 480, S = 1, OX = 0, OY = 0, EX0 = 0, EX1 = 480, EY0 = 0, EY1 = 300, CX = 90;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || window.innerWidth; H = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  VW = clamp(VH * W / H, 320, 640);
  S = Math.min(W / VW, H / VH);
  OX = (W - VW * S) / 2; OY = (H - VH * S) / 2;
  EX0 = -OX / S; EX1 = VW + OX / S; EY0 = -OY / S; EY1 = VH + OY / S;
  CX = VW < 420 ? 72 : 92;
}

/* ---------- game state ---------- */
let state = 'title', T = 0, dist = 0, ramp = 0, lives = 3, shake = 0, finT = 0, deadT = 0;
let celebrate = false, fwT = 0, stage = 0, st = null, L = null, trailT = 0;
let cat = {}, pw = { vanilla: 0, eggnog: 0 }, cp = { dist: 0 }, toast = { t: 0, txt: '' };
const input = { down: false, pressed: false };
const parts = [];
let save = { stars: [], coins: 0, total: 0, owned: [], eq: {} };   /* saved on her phone: stars, coins, shop */
try { Object.assign(save, JSON.parse(localStorage.getItem('maeveSave2') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('maeveSave2', JSON.stringify(save)); } catch (e) {} };

/* ---------- sound (all synthesised, no files) ---------- */
let AC = null, master = null, muted = false, mstep = 0, mnext = 0;
try { muted = localStorage.getItem('maeveMuted') === '1'; } catch (e) {}
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : .55; master.connect(AC.destination);
    mnext = AC.currentTime + .1; setInterval(sched, 40);
  } catch (e) { AC = null; }
}
function tone(f, t, d, type, v, f2) {
  if (!AC) return;
  const o = AC.createOscillator(), n = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  n.gain.setValueAtTime(.0001, t); n.gain.exponentialRampToValueAtTime(v, t + .012); n.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(n); n.connect(master); o.start(t); o.stop(t + d + .05);
}
const now = () => AC ? AC.currentTime : 0;
const sfx = {
  coin() { const t = now(); tone(988, t, .08, 'sine', .16); tone(1319, t + .07, .14, 'sine', .16); },
  jump() { tone(380, now(), .16, 'sine', .14, 760); },
  jump2() { tone(560, now(), .18, 'triangle', .14, 1100); },
  stomp() { const t = now(); tone(300, t, .1, 'square', .08, 120); tone(700, t + .06, .1, 'sine', .12); },
  hit() { tone(260, now(), .3, 'sawtooth', .09, 90); },
  pow() { const t = now(); [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .07, .2, 'triangle', .14)); },
  win() { const t = now(); [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * .11, .3, 'triangle', .14)); }
};
/* four songs, one per world. Notes are MIDI numbers (60 = middle C); bass changes every 4 notes */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const SONGS = [
  { step: .24, type: 'triangle', vol: .04, mel: [76,79,81,79,76,74,72,74, 76,79,84,81,79,76,74,76, 77,81,84,81,77,76,74,72, 74,79,83,79,74,72,71,72], bass: [48,48,45,45,41,41,43,43] },
  { step: .22, type: 'triangle', vol: .04, mel: [69,72,76,72,74,72,69,67, 69,72,76,79,76,74,72,69, 67,69,72,69,67,64,67,69, 72,69,67,64,62,64,67,69], bass: [45,45,43,43,41,41,43,43] },
  { step: .30, type: 'sine',     vol: .06, mel: [74,78,81,78,83,81,78,74, 76,79,83,79,81,79,76,74, 71,74,78,74,76,74,71,69, 69,71,74,78,76,74,71,74], bass: [50,50,47,47,45,45,47,47] },
  { step: .30, type: 'triangle', vol: .045, mel: [72,77,81,84,81,77,72,77, 74,77,82,81,77,74,72,70, 69,72,77,81,77,72,69,72, 70,74,77,74,72,70,69,72], bass: [41,41,46,46,48,48,43,43] }
];
let song = 0;
const setSong = i => { if (i !== song) { song = i; mstep = 0; } };
function sched() {
  if (!AC) return;
  if (muted) { mnext = AC.currentTime + .1; return; }
  const sg = SONGS[song];
  while (mnext < AC.currentTime + .25) {
    tone(mtof(sg.mel[mstep % 32]), mnext, sg.step * 1.25, sg.type, sg.vol);
    if (mstep % 4 === 0) tone(mtof(sg.bass[(mstep / 4 | 0) % 8]), mnext, sg.step * 3, 'sine', .06);
    mstep++; mnext += sg.step;
  }
}
$('mute').textContent = muted ? '🔇' : '🔊';
$('mute').addEventListener('click', e => {
  e.stopPropagation(); audioInit(); muted = !muted;
  if (master) master.gain.value = muted ? 0 : .55;
  $('mute').textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem('maeveMuted', muted ? '1' : '0'); } catch (err) {}
});

/* ============ 3 · DRAWING: icons, Maeve, enemies, particles ============ */
function rr(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circ(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, TAU); }
function heartPath(x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * .9);
  g.bezierCurveTo(x - s * 1.3, y + s * .1, x - s * .9, y - s * .9, x, y - s * .35);
  g.bezierCurveTo(x + s * .9, y - s * .9, x + s * 1.3, y + s * .1, x, y + s * .9); g.closePath();
}
function star4(x, y, s) {
  g.beginPath(); g.moveTo(x, y - s); g.quadraticCurveTo(x + s * .18, y - s * .18, x + s, y);
  g.quadraticCurveTo(x + s * .18, y + s * .18, x, y + s); g.quadraticCurveTo(x - s * .18, y + s * .18, x - s, y);
  g.quadraticCurveTo(x - s * .18, y - s * .18, x, y - s); g.closePath();
}
function starfish(x, y, r, col) {
  g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  g.closePath(); g.fill();
}
function cherry(x, y, s) {
  g.strokeStyle = '#4f9a55'; g.lineWidth = 1.6 * s; g.lineCap = 'round'; g.beginPath();
  g.moveTo(x - 4 * s, y + 3 * s); g.quadraticCurveTo(x - 2 * s, y - 7 * s, x + 2 * s, y - 9 * s);
  g.moveTo(x + 4 * s, y + 4 * s); g.quadraticCurveTo(x + 4 * s, y - 6 * s, x + 2 * s, y - 9 * s); g.stroke();
  g.fillStyle = '#5fbf6a'; g.beginPath(); g.ellipse(x + 6 * s, y - 9 * s, 5 * s, 2.4 * s, -.3, 0, TAU); g.fill();
  for (const dx of [-4, 4]) {
    const cy = y + (dx < 0 ? 3 : 4) * s;
    g.fillStyle = '#ff3d6e'; circ(x + dx * s, cy, 4.7 * s); g.fill();
    g.fillStyle = 'rgba(255,255,255,.75)'; circ(x + (dx - 1.6) * s, cy - 1.6 * s, 1.2 * s); g.fill();
  }
}
function shell(x, y, s) {
  g.fillStyle = '#ffc4da'; g.strokeStyle = '#f08fb4'; g.lineWidth = .9 * s;
  g.beginPath(); g.moveTo(x, y + 6 * s); g.arc(x, y + 6 * s, 12 * s, Math.PI * 1.12, Math.PI * 1.88); g.closePath(); g.fill(); g.stroke();
  g.beginPath();
  for (let i = 0; i < 5; i++) { const a = Math.PI * (1.2 + i * .15); g.moveTo(x, y + 6 * s); g.lineTo(x + Math.cos(a) * 11 * s, y + 6 * s + Math.sin(a) * 11 * s); }
  g.stroke(); g.fillStyle = '#ffe3ee'; circ(x, y + 6.5 * s, 2.6 * s); g.fill();
}
function pearl(x, y, s) {
  const gr = g.createRadialGradient(x - 2 * s, y - 2 * s, .5, x, y, 6.5 * s);
  gr.addColorStop(0, '#fff'); gr.addColorStop(.6, '#ffe3f0'); gr.addColorStop(1, '#e9a6c8');
  g.fillStyle = gr; circ(x, y, 6.5 * s); g.fill();
}
function cup(x, y, s, kind) {
  const v = kind === 'vanilla';
  g.fillStyle = v ? '#fffaf0' : '#fff0c2';
  g.beginPath(); g.moveTo(x - 6.5 * s, y - 4 * s); g.lineTo(x + 6.5 * s, y - 4 * s); g.lineTo(x + 4.8 * s, y + 9 * s); g.lineTo(x - 4.8 * s, y + 9 * s); g.closePath(); g.fill();
  g.fillStyle = v ? '#ff7fb0' : '#e8505b';
  g.beginPath(); g.moveTo(x - 5.9 * s, y + 0 * s); g.lineTo(x + 5.9 * s, y + 0 * s); g.lineTo(x + 5.2 * s, y + 6 * s); g.lineTo(x - 5.2 * s, y + 6 * s); g.closePath(); g.fill();
  g.fillStyle = '#fff'; heartPath(x, y + 3 * s, 1.9 * s); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.ellipse(x, y - 4.6 * s, 7.4 * s, 2.5 * s, 0, 0, TAU); g.fill();
  g.fillStyle = v ? '#ffe9f3' : '#ffe0a0'; g.beginPath(); g.ellipse(x, y - 6 * s, 5 * s, 3 * s, 0, Math.PI, TAU); g.fill();
}
function drawCoin(c, x, y) {
  const b = Math.sin(T * 3 + c.x * .05) * 2;
  g.save(); g.translate(x, y + b);
  g.fillStyle = 'rgba(255,255,255,.28)'; circ(0, 0, 11); g.fill();
  if (c.t === 'cherry') cherry(0, 0, 1.15); else if (c.t === 'heart') { g.fillStyle = '#ff5c97'; heartPath(0, 0, 7.5); g.fill(); g.fillStyle = 'rgba(255,255,255,.7)'; circ(-3, -3, 1.5); g.fill(); }
  else if (c.t === 'shell') shell(0, -3, .95); else pearl(0, 0, 1.1);
  g.restore();
}
function drawPow(p, x, y) {
  const b = Math.sin(T * 3 + p.x) * 3;
  g.save(); g.translate(x, y + b);
  const gr = g.createRadialGradient(0, 0, 2, 0, 0, 26); gr.addColorStop(0, 'rgba(255,240,200,.95)'); gr.addColorStop(1, 'rgba(255,200,230,0)');
  g.fillStyle = gr; circ(0, 0, 26); g.fill();
  if (p.t === 'life') { g.fillStyle = '#ff3f84'; heartPath(0, 0, 12); g.fill(); g.fillStyle = 'rgba(255,255,255,.7)'; circ(-4, -5, 2.4); g.fill(); }
  else cup(0, 0, 1.5, p.t);
  g.fillStyle = '#fff'; star4(14, -12 + Math.sin(T * 5) * 2, 3.5); g.fill();
  g.restore();
}

/* ---------- Maeve, the cat in the leopard-print costume ---------- */
/* Optional: your own artwork. Put transparent PNGs next to this file and list them in CONFIG.catSprites.
   If any fail to load, the drawn cat below is used instead. */
const CATIMG = { run: [], jump: null, ok: false };

function pickCoin(r, s) {
  let tot = 0; for (const k in s.coinMix) tot += s.coinMix[k];
  let v = r() * tot; for (const k in s.coinMix) { v -= s.coinMix[k]; if (v <= 0) return k; }
  return 'cherry';
}

function genRun(s, idx) {

  const crab = x => Lv.en.push({ k: 'crab', x, x0: x, y: G - 9, w: 24, h: 17, vx: -26, ph: r() * 6, alive: true });
  const urchin = (x, y) => Lv.en.push({ k: 'urchin', x, x0: x, y: (y || G) - 10, w: 22, h: 20, ph: r() * 6, alive: true });
  const plat = (x, y, w, o) => { const p = Object.assign({ x, x0: x, y, y0: y, w, bob: 0, sl: 0, ph: 0, pyl: false, cr: false, vn: null, st: 0, ct: 0, vy: 0, on: true }, o); Lv.plats.push(p); return p; };
  const gap = (x, w) => Lv.gaps.push({ x, w });
  const arcOver = (x0, x1, n, h) => { for (let i = 0; i < n; i++) coin(x0 + i * (x1 - x0) / (n - 1), G - 20 - Math.sin(i / (n - 1) * PI) * h); };
  const rider = (p, dx) => { const c = coin(p.x + dx, p.y - 18); c.pl = p; c.ox = dx; Lv.pc.push(c); };
  const item = (x, t) => { const p = plat(x, G - 62, 110); Lv.pows.push({ x: x + 55, y: p.y - 26, t, got: false }); return x + 300; };
  const P = {
    /* --- on the ground --- */
    row: x => { for (let i = 0; i < 5; i++) coin(x + i * 26, G - 16); return x + 280; },
    arc: x => { for (let i = 0; i < 6; i++) coin(x + i * 26, G - 16 - Math.sin(i / 5 * PI) * 62); return x + 330; },
    crab: x => { crab(x); for (let i = 0; i < 3; i++) coin(x - 26 + i * 26, G - 72); return x + 260; },
    urchin: x => { urchin(x); for (let i = 0; i < 5; i++) coin(x - 52 + i * 26, G - 18 - Math.sin(i / 4 * PI) * 70); return x + 280; },

}
function runPhys(dt) {
  if (cat.pl) {   /* standing on a moving platform: ride along with it */
    const p = cat.pl, sx = p.x - dist;
    if (cat.onGround && cat.vy >= 0 && solid(p) && sx < CX + 9 && sx + p.w > CX - 9) cat.y = p.y; else cat.pl = null;
  }
  const prev = cat.y, was = cat.onGround;
  if (cat.coy > 0) cat.coy -= dt;
  if (cat.buf > 0) {
    if (cat.onGround || cat.coy > 0) { cat.vy = JV; cat.onGround = false; cat.coy = 0; cat.jumps = 1; cat.buf = 0; sfx.jump(); }
    else if (cat.jumps < 2 && pw.vanilla > 0) { cat.vy = JV * .92; cat.jumps = 2; cat.buf = 0; sfx.jump2(); burst(CX, cat.y - 10, 8, 'spark', ['#fff', '#ffd0e4', '#ffe9a0']); }
  }
  const rising = cat.vy < 0;
  cat.vy = Math.min(cat.vy + GRAV * (rising ? (input.down ? .9 : 2.3) : 1) * dt, 820);
  cat.y += cat.vy * dt; cat.onGround = false;
  const inGap = L.gaps.some(q => CX > q.x - dist + 5 && CX < q.x + q.w - dist - 5);
  if (cat.y >= GROUND && !inGap && prev <= GROUND + 4) { cat.y = GROUND; cat.vy = 0; cat.onGround = true; cat.pl = null; }
  else if (cat.vy >= 0) {
    for (const p of L.plats) {
      const sx = p.x - dist;
      if (solid(p) && sx < CX + 9 && sx + p.w > CX - 9 && prev <= p.y + 3 && cat.y >= p.y) {
        cat.y = p.y; cat.vy = 0; cat.onGround = true; cat.pl = p; if ((p.cr || p.vn) && p.st === 0) { p.st = 1; p.ct = 0; } break;
      }
    }
  }
  if (cat.onGround) { if (!was) burst(CX - 6, cat.y, 3, 'dot', ['#fff3dc']); cat.jumps = 0; cat.coy = 0; }
  else if (was && cat.jumps === 0) cat.coy = .09;
  else if (!was && cat.coy <= 0 && cat.jumps === 0) cat.jumps = 1;
  if (L.gaps.length && cat.y > GROUND + 26) fell();
}
function swimPhys(dt) {
  cat.vy = clamp(cat.vy + (520 + (input.down ? -820 : 0)) * dt, -200, 210);
  cat.y += cat.vy * dt;
  if (cat.y < 26) { cat.y = 26; cat.vy = 0; } if (cat.y > 238) { cat.y = 238; cat.vy = 0; }
  if (Math.random() < dt * 7) parts.push({ k: 'bub', x: CX - 14, y: cat.y, vx: -20, vy: -10, t: 0, max: 1.1, sz: 3 + Math.random() * 3, r: 0, vr: 0, col: '#fff' });
}
function moveEnemies(dt) {
  const b = catBox();
  for (const e of L.en) {
    if (!e.alive) continue;
    let sx = e.x - dist; if (sx > VW + 70 || sx < -90) continue;
    if (e.k === 'crab' || e.k === 'puffer') e.x += e.vx * dt;
    if (e.pl) { if (e.x < e.pl.x0 + 14) e.vx = Math.abs(e.vx); else if (e.x > e.pl.x1 - 14) e.vx = -Math.abs(e.vx); }
    if (e.sl) e.x = e.x0 + Math.sin(T * 1.5 + e.ph) * e.sl;
    if (e.k === 'gull') { e.x -= 20 * dt; e.y = e.by + Math.sin(T * 2.2 + e.ph) * 20; }
    else if (e.k === 'jelly') e.y = e.by + Math.sin(T * 1.8 + e.ph) * (e.amp || 8);
    else if (e.k === 'puffer') e.y = e.by + Math.sin(T * 2 + e.ph) * 14;
    sx = e.x - dist;
    if (Math.abs(sx - CX) < (e.w + b.w) / 2 && Math.abs(e.y - b.cy) < (e.h + b.h) / 2) {
      if (e.k === 'crab' && cat.vy > 40 && cat.y <= e.y - e.h / 2 + 11) {
        e.alive = false; cat.vy = -380; cat.jumps = 1; cat.onGround = false; sfx.stomp();
        burst(sx, e.y - 4, 8, 'heart', ['#ff7fb0', '#ffc2da']);
      } else hurt();
    }
  }
}
function collect(dt) {
  const b = catBox();
  for (const c of L.coins) {
    if (c.got) continue; let sx = c.x - dist; if (sx < -30 || sx > VW + 30) continue;
    if (pw.eggnog > 0) {
      const dx = CX - sx, dy = b.cy - c.y, d = Math.hypot(dx, dy);
      if (d < 120 && d > 1) { c.x += dx / d * 340 * dt; c.y += dy / d * 340 * dt; sx = c.x - dist; }
    }
    if (Math.abs(sx - CX) < 18 && Math.abs(c.y - b.cy) < 20) { c.got = true; sfx.coin(); burst(sx, c.y, 5, 'spark', ['#fff', '#ffd0e4', '#ffe9a0']); }
  }
  for (const p of L.pows) {
    if (p.got) continue; const sx = p.x - dist; if (sx < -30 || sx > VW + 30) continue;
    if (Math.abs(sx - CX) < 22 && Math.abs(p.y - b.cy) < 26) {
      p.got = true; sfx.pow(); burst(sx, p.y, 14, 'heart', ['#ff7fb0', '#ffc2da', '#fff']);
      if (p.t === 'life') { lives = Math.min(5, lives + 1); say('Extra heart! ♥'); }
      else if (p.t === 'vanilla') { pw.vanilla = 12; say('Vanilla latte! Tap twice to double jump ♥'); }
      else { pw.eggnog = 12; say('Eggnog latte! Treasures float to you ♥'); }
    }
  }
}
function update(dt) {
  T += dt; shake = Math.max(0, shake - dt * 2.2); toast.t -= dt;
  updateParts(dt);
  if (state === 'home' || state === 'levels' || state === 'shop') { dist += 55 * dt; cat.phase += dt * 9; return; }
  if (state === 'dying') { cat.vy += 1400 * dt; cat.y += cat.vy * dt; cat.rot += dt * 8; deadT += dt; if (deadT > 1.1) { state = 'over'; showOver(); } return; }
  if (state === 'ready' || state === 'over' || state === 'clear') { cat.phase += dt * 3; return; }
  if (state === 'finale') {
    cat.phase += dt * 4;
    if (celebrate) { fwT -= dt; if (fwT <= 0) { fwT = .45; fireworks(); } }
    return;
  }
  for (const p of L.plats) {   /* moving, vanishing and crumbling platforms */
    if (p.bob) p.y = p.y0 + Math.sin(T * 1.7 + p.ph) * p.bob;
    if (p.sl) p.x = p.x0 + Math.sin(T * 1.4 + p.ph) * p.sl;
    if (p.vn) {   /* disappears a moment after Maeve lands on it, then comes back */
      if (p.st === 1) { p.ct += dt; if (p.ct > p.vn[0]) { p.st = 2; p.ct = 0; } }
      else if (p.st === 2) { p.ct += dt; if (p.ct > p.vn[1]) { p.st = 0; p.ct = 0; } }
    }
    if (p.cr) { if (p.st === 1) { p.ct += dt; if (p.ct > .5) { p.st = 2; p.vy = 0; } } else if (p.st === 2) { p.vy += 900 * dt; p.y += p.vy * dt; } }
  }
  for (const c of L.pc) { c.x = c.pl.x + c.ox; c.y = c.pl.y - 18; }
  const fin = state === 'finish';
  if (fin) { finT += dt; ramp = Math.max(0, 1 - finT / .5); } else ramp = Math.min(1, ramp + dt / 1.2);
  const sp = st.speed * ramp; dist += sp * dt; cat.phase += dt * (8 + sp / 22);
  cat.inv = Math.max(0, cat.inv - dt); pw.vanilla = Math.max(0, pw.vanilla - dt); pw.eggnog = Math.max(0, pw.eggnog - dt);
  if (input.pressed) { cat.buf = .14; input.pressed = false; }
  cat.buf = Math.max(0, cat.buf - dt);
  if (st.mode === 'run') runPhys(dt); else swimPhys(dt);
  trailT -= dt;
  if (trailT <= 0 && (pw.vanilla > 0 || pw.eggnog > 0)) {
    trailT = .06;
    burst(CX - 8, (st.mode === 'run' ? cat.y - 12 : cat.y), 1, pw.vanilla > 0 ? 'spark' : 'heart', pw.vanilla > 0 ? ['#fff', '#ffd0e4'] : ['#ffcf7a'], .5);
  }
  if (!fin) {
    moveEnemies(dt); collect(dt);
    for (const f of L.flags) if (!f.hit && dist + CX >= f.x) {
      f.hit = true; cp.dist = f.x - CX - 60; say('Checkpoint ♥'); sfx.coin(); burst(f.x - dist, 190, 10, 'heart', ['#ff7fb0', '#ffc2da']);
    }
    if (state === 'play' && dist + CX >= st.len) { state = 'finish'; finT = 0; sfx.win(); burst(CX, 130, 20, 'heart', ['#ff7fb0', '#ffc2da', '#fff']); burst(CX, 130, 14, 'conf', ['#ff7fb0', '#ffe08a', '#fff']); }
  } else if (finT > 1.3) finishLevel();
}

/* ============ 9 · RENDER (drawing each frame) ============ */
function drawEntities() {
  for (const c of L.coins) { if (c.got) continue; const sx = c.x - dist; if (sx < EX0 - 30 || sx > EX1 + 30) continue; drawCoin(c, sx, c.y); }
  for (const p of L.pows) { if (p.got) continue; const sx = p.x - dist; if (sx < EX0 - 40 || sx > EX1 + 40) continue; drawPow(p, sx, p.y); }
  for (const e of L.en) { if (!e.alive) continue; const sx = e.x - dist; if (sx < EX0 - 40 || sx > EX1 + 40) continue; drawEnemy(e, sx, e.y); }
}
function drawCatNow() {
  const run = !st || st.mode === 'run';
  const air = run ? (!cat.onGround && state !== 'title' && state !== 'ready') : true;
  const cy = run ? cat.y : cat.y + 13;
  if (pw.vanilla > 0 || pw.eggnog > 0) {
    const gr = g.createRadialGradient(CX, cy - 14, 2, CX, cy - 14, 34 + Math.sin(T * 6) * 2);
    gr.addColorStop(0, pw.vanilla > 0 ? 'rgba(255,240,250,.7)' : 'rgba(255,220,140,.7)'); gr.addColorStop(1, 'rgba(255,220,240,0)');
    g.fillStyle = gr; g.fillRect(CX - 40, cy - 54, 80, 80);
  }
  let alpha; if (cat.inv > 0 && Math.floor(T * 14) % 2) alpha = .35;
  drawCat(CX, cy, { phase: cat.phase, air, eq: save.eq, blink: (T % 3.2) < .12, alpha, rot: (cat.rot || 0) + (run ? 0 : clamp(cat.vy * .002, -.3, .3)) });
}
function outlined(txt, x, y, size, col, align) {
  g.font = '800 ' + size + 'px "Avenir Next Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';
  g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineWidth = 4;
  g.strokeStyle = 'rgba(255,255,255,.92)'; g.strokeText(txt, x, y); g.fillStyle = col || '#c2185b'; g.fillText(txt, x, y);
}
function drawHUD() {
  if (!L) return;
  const got = L.coins.reduce((n, c) => n + (c.got ? 1 : 0), 0);
  cherry(16, 18, 1.05); outlined(String(got), 30, 19, 16);
  const nl = Math.max(3, lives);
  for (let i = 0; i < nl; i++) {
    const hx = VW - 16 - i * 20; g.fillStyle = i < lives ? '#ff3f84' : 'rgba(255,255,255,.5)'; heartPath(hx, 18, 7.5); g.fill();
    if (i < lives) { g.fillStyle = 'rgba(255,255,255,.6)'; circ(hx - 3, 15, 1.4); g.fill(); }
  }
  const bw = Math.min(200, VW - 160), bx = (VW - bw) / 2, pr = clamp((dist + CX) / st.len, 0, 1);
  g.fillStyle = 'rgba(255,255,255,.65)'; rr(bx, 14, bw, 9, 4.5); g.fill();
  g.fillStyle = '#ff7fb0'; rr(bx, 14, Math.max(9, bw * pr), 9, 4.5); g.fill();
  g.fillStyle = '#fff'; for (const f of [.34, .67]) g.fillRect(bx + bw * f - 1, 14, 2, 9);
  g.fillStyle = '#ff3f84'; heartPath(bx + Math.max(4, bw * pr), 18.5, 6); g.fill();
  g.fillStyle = '#ffb02e'; star4(bx + bw + 8, 18.5, 5); g.fill();
  let py = 40;
  for (const k of ['vanilla', 'eggnog']) if (pw[k] > 0) {
    cup(16, py, .9, k); g.fillStyle = 'rgba(255,255,255,.7)'; rr(28, py - 3, 46, 6, 3); g.fill();
    g.fillStyle = k === 'vanilla' ? '#ff7fb0' : '#ffb02e'; rr(28, py - 3, 46 * pw[k] / 12, 6, 3); g.fill(); py += 22;
  }
  if (toast.t > 0) {
    g.globalAlpha = Math.min(1, toast.t * 2);
    g.font = '800 14px "Avenir Next Rounded","Trebuchet MS",system-ui,sans-serif';
    const w = g.measureText(toast.txt).width + 26; g.fillStyle = 'rgba(255,255,255,.88)'; rr(VW / 2 - w / 2, 58, w, 26, 13); g.fill();
    g.fillStyle = '#c2185b'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(toast.txt, VW / 2, 71.5); g.globalAlpha = 1;
  }
  if (state === 'ready') {
    outlined('Level ' + (stage + 1), VW / 2, 98, 32, '#d81b6a', 'center');
    outlined(st.name, VW / 2, 126, 17, '#b0457f', 'center');
    outlined(st.hint, VW / 2, 150, 12, '#b0457f', 'center');
    g.globalAlpha = .6 + .4 * Math.sin(T * 5); outlined('Tap to start ♥', VW / 2, 176, 18, '#e0488a', 'center'); g.globalAlpha = 1;
  }
}
function render() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  g.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  if (shake > 0) g.translate((Math.random() - .5) * shake * 14, (Math.random() - .5) * shake * 14);
  drawBG();
  if (L) { drawLevelBack(); drawEntities(); }
  drawCatNow(); drawParts();
  drawHUD();
  drawPreview();
}

/* ============ 10 · INPUT + START ============ */
function press() {
  audioInit();
  if (state === 'ready') { state = 'play'; ramp = 0; return; }
  if (state === 'play') { input.down = true; input.pressed = true; }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
for (const n of ['pointerup', 'pointercancel', 'pointerleave']) cv.addEventListener(n, () => { input.down = false; });
window.addEventListener('keydown', e => {
  if (ov.classList.contains('show')) return;
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
});
window.addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) input.down = false; });
window.addEventListener('blur', () => { input.down = false; });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);

let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); render(); requestAnimationFrame(frame);
}
resize();
const qs = new URLSearchParams(location.search);
normaliseSave();
if (qs.has('unlock')) save.stars = save.stars.map(v => v || 1);
$('homeBtn').addEventListener('click', e => { e.stopPropagation(); audioInit(); showHome(); });
if (qs.has('finale')) { startLevel(LEVELS.length - 1); dist = st.len - 260; }
else if (qs.has('level') || qs.has('stage')) startLevel(clamp((+(qs.get('level') || qs.get('stage')) || 1) - 1, 0, LEVELS.length - 1));
else showHome();
last = performance.now(); requestAnimationFrame(frame);
})();
</script>
